esphome:
  name: keybridge
  friendly_name: KeyBridge
  name_add_mac_suffix: true
  project:
    name: keybridge.keybridge
    version: "0.0.1"

esp32:
  board: esp32-s2-saola-1
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

# external_components:
#   - source:
#       type: git
#       url: https://github.com/abdalrahimnaser/keybridge-esphome
#       ref: main
#     components: [KeyBridge]
#     # refresh: 1s
    
# external_components:
#   - source:
#       type: local
#       path: components

dashboard_import:
  package_import_url: github://abdalrahimnaser/keybridge-esphome/keybridge.yaml@main
  import_full_config: true

api:
  reboot_timeout: 0s
  batch_delay: 0ms

ota:
  - platform: web_server
  - platform: http_request

http_request:

update:
  - platform: http_request
    name: Firmware
    source: https://abdalrahimnaser.github.io/keybridge-esphome/manifest.json
    update_interval: 6h

wifi:
  ap:
    ssid: "KeyBridge Setup"

captive_portal:

web_server:
  port: 80

KeyBridge:

binary_sensor:
